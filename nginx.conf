server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Lotes de sincronização com fotos e planilhas de importação.
  client_max_body_size 30m;

  # Mesma origem para a API: sem CORS e o service worker não interfere em /api.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /health { proxy_pass http://api:3000/health; }

  # O service worker e o manifest nunca podem ficar presos em cache — senão
  # uma versão nova do app não chega aos aparelhos.
  location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota (/conferir/123, /verificar/abc, /b/0102051) cai no index.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
